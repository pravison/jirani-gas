  <style>
  .popup {
      display: none; /* Hidden by default */
      position: fixed; /* Ensures the popup stays on the screen */

      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5); /* Dark overlay */

      align-items: center;
      z-index: 9999; /* Higher z-index to appear on top of other elements */

  /* Popup content box */

      padding: 20px;

      text-align: center;

  /* #cc922e */

<body>
  <header id="header" class="header fixed-top d-flex align-items-center">

          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">

              </a>

              <hr class="dropdown-divider">
            </li>

            <li>
              <a class="dropdown-item d-flex align-items-center" href="https://wa.me/254706420043/">
                <i class="bi bi-question-circle"></i>

      </ul>
    </nav><!-- End Icons Navigation -->

  </header><!-- End Header -->

<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="bg-white w-full max-w-2xl p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">{{ challenge.title }}</h1>

    <div class="text-sm text-gray-500 mb-4 text-center" id="progress-text"></div>

    <div id="quiz-box">
      <div id="question-container" class="mb-6">
        <p id="question-text" class="text-lg font-medium text-gray-800 mb-4"></p>
        <form id="choices-container" class="space-y-4"></form>
      </div>

      <div class="text-right">
        <button id="next-btn" class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700 hidden">Next</button>
      </div>
    </div>
  </div>
</div>

<script>
  const questions = {{ questions_json|safe }};
  const participantToken = "{{ participant.session_token }}";
  let currentIndex = {{ start_index }};
  let startTime = null;
  let answered = false;

  const questionText = document.getElementById('question-text');
  const choicesContainer = document.getElementById('choices-container');
  const nextButton = document.getElementById('next-btn');
  const progressText = document.getElementById('progress-text');

  function loadQuestion() {
    const q = questions[currentIndex];
    questionText.innerText = q.text;
    progressText.innerText = `Question ${currentIndex + 1} of ${questions.length}`;
    choicesContainer.innerHTML = '';
    nextButton.classList.add('hidden');
    answered = false;

    q.choices.forEach(choice => {
      const label = document.createElement('label');
      label.className = "block border border-gray-300 rounded px-4 py-3 cursor-pointer hover:bg-blue-50 transition";

      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'choice';
      input.value = choice.id;
      input.className = "mr-3";
      input.onclick = () => submitAnswer(q.id, choice.id, label);

      const span = document.createElement('span');
      span.innerText = choice.text;

      label.appendChild(input);
      label.appendChild(span);
      choicesContainer.appendChild(label);
    });

    startTime = Date.now() / 1000;
  }

  function submitAnswer(questionId, choiceId, selectedLabel) {
    if (answered) return;

    const endTime = Date.now() / 1000;
    const timeTaken = endTime - startTime;

    fetch("{% url 'save_answer' %}", {
      method: 'POST',
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}"
      },
      body: JSON.stringify({
        question_id: questionId,
        choice_id: choiceId,
        start_time: startTime,
        token: participantToken
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        answered = true;
        nextButton.classList.remove('hidden');

        // highlight selected label
        const labels = choicesContainer.querySelectorAll('label');
        labels.forEach(label => label.classList.add("opacity-50"));
        selectedLabel.classList.remove("opacity-50");
        selectedLabel.classList.add(data.percentage > 0 ? "bg-green-100 border-green-400" : "bg-red-100 border-red-400");

        // disable inputs
        choicesContainer.querySelectorAll('input').forEach(input => input.disabled = true);
      }
    });
  }

  nextButton.onclick = () => {
    currentIndex++;
    if (currentIndex < questions.length) {
      loadQuestion();
    } else {
      
    }
  };

  document.addEventListener('DOMContentLoaded', loadQuestion);
</script>

</body>
</html>
